<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="LiftLog"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"></head><body>
<title>LiftLog</title>
<meta name="theme-color" content="#0f0f12">
<style>
:root{--bg:#0f0f12;--card:#1a1a20;--card2:#26262f;--line:#2e2e38;--text:#f2f2f5;--sub:#9a9aa8;--accent:#ff5a1f;--accent-soft:rgba(255,90,31,.25);--ok:#22c55e;--ok-soft:rgba(34,197,94,.12);--danger:#ff4d5e;--gold:#facc15;--shade:rgba(0,0,0,.6);--white:#fff;--hot:#ff2d3d;--hot-soft:rgba(255,45,61,.4);--skin:#c9ccd4;--skin2:#8e919c;--mus:#aeb2bd;--mus2:#7b7e89;--hair:#3b3b45;--plate:#22222a;--prop:#33333d;--mm:#3a3a46;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font-family:inherit;cursor:pointer}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:14px 16px;border-bottom:1px solid var(--line);z-index:5}
header h1{font-size:18px;max-width:640px;margin:0 auto}
main{padding:16px;padding-bottom:170px;max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav button{flex:1;min-width:0;background:none;border:0;color:var(--sub);padding:9px 0 7px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap}
nav button .i{font-size:20px}
nav button.on{color:var(--accent)}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.card2{background:var(--card2);border-radius:12px;padding:12px;margin-top:10px}
.btn{background:var(--card2);color:var(--text);border:0;border-radius:10px;padding:11px 14px;font-size:14px;font-weight:600;text-align:center}
.btn.p{background:var(--accent);color:var(--white)}
.btn.ok{background:var(--ok);color:var(--white)}
.btn.d{color:var(--danger)}
.btn.dz{background:var(--danger);color:var(--white)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.4}
.full{width:100%;display:block}
.btn.full{padding:14px}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.mt{margin-top:10px}
.c{text-align:center}
.sub{color:var(--sub);font-size:12px}
.err{color:var(--danger)}
.sec{color:var(--sub);font-size:13px;font-weight:700;margin:18px 2px 8px}
.empty{color:var(--sub);text-align:center;padding:28px 0}
.tag{background:var(--card2);color:var(--sub);font-size:11px;padding:2px 8px;border-radius:99px;white-space:nowrap}
.icon{background:none;border:0;color:var(--sub);font-size:18px;width:32px;height:32px;border-radius:8px;flex:none}
.inp{background:var(--card2);border:0;border-radius:10px;color:var(--text);padding:11px 12px;font-size:16px;min-width:0;width:100%}
.row .inp{width:auto}
.row .inp.grow{width:100%}
p{line-height:1.7;font-size:14px}
ul{padding-left:18px;margin-top:6px;font-size:14px;line-height:1.7}
.hero{text-align:center;padding:28px 16px}
.big{font-size:22px;font-weight:800;margin-bottom:16px}
.live{border:1px solid var(--accent)}
.timer{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.vol{font-size:20px;font-weight:700;text-align:right}
.set,.sh{display:grid;grid-template-columns:34px 1fr 1fr 46px 30px;gap:6px;align-items:center;text-align:center;margin-top:6px}
.sh{color:var(--sub);font-size:12px;margin-top:12px}
.set{border-radius:10px;padding:2px 0}
.set input{background:var(--card2);border:0;border-radius:8px;color:var(--text);text-align:center;padding:9px 4px;font-size:16px;width:100%;min-width:0}
.set.done{background:var(--ok-soft)}
.bsel{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pfoot{position:sticky;bottom:0;display:flex;justify-content:flex-end;gap:8px;margin-top:10px;padding-top:12px;background:var(--card)}
.chk{background:var(--card2);border:0;border-radius:8px;height:38px;color:var(--sub);font-size:18px}
.set.done .chk{background:var(--ok);color:var(--white)}
#rest{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));background:var(--card2);z-index:9;overflow:hidden;border-top:1px solid var(--line)}
#rest .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent-soft);transition:width .5s linear}
#rest .rin{position:relative;display:flex;align-items:center;gap:8px;padding:10px 16px;max-width:640px;margin:0 auto}
#rest .t{font-size:22px;flex:1;font-variant-numeric:tabular-nums}
#modal{position:fixed;inset:0;background:var(--shade);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:17px}
#dlg{position:fixed;inset:0;background:var(--shade);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.dbox{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:340px;line-height:1.6}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:40;max-width:calc(100% - 32px)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0;padding-bottom:4px}
.chip{background:var(--card2);color:var(--sub);border:0;border-radius:99px;padding:7px 14px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--white)}
.li{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);padding:13px 4px;font-size:15px;text-align:left}
.li.on{color:var(--accent)}
.li.on .tag{background:var(--accent);color:var(--white)}
.ritem{display:flex;align-items:center;gap:4px;padding:8px 0;border-bottom:1px solid var(--line)}
.ritem .n{min-width:52px;text-align:center;font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd{color:var(--sub);font-size:12px;padding:4px 0}
.day{background:none;border:0;color:var(--text);aspect-ratio:1;max-width:100%;border-radius:50%;font-size:14px}
.day.today{color:var(--accent);font-weight:800}
.day.has{background:var(--accent-soft)}
.day.sel{outline:2px solid var(--accent)}
.hl{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);margin-top:8px;font-size:14px}
.hl .sub{text-align:right;flex:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.tiles b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.chart{width:100%;display:block;margin-top:8px}
.chart text{fill:var(--sub);font-size:10px}
.chart .bar{fill:var(--accent)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5}
.chart .dot{fill:var(--accent)}
.pbar{display:grid;grid-template-columns:52px 1fr 40px;gap:8px;align-items:center;margin-top:8px;font-size:13px}
.pbar i{display:block;height:10px;border-radius:5px;background:var(--accent)}
.pr{color:var(--gold);margin-top:6px;font-size:14px}
.pf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pf label,.nutin label{display:flex;flex-direction:column;gap:4px;min-width:0}
.kcal{text-align:center}
.kcal b{font-size:36px;font-variant-numeric:tabular-nums}
.nut{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;text-align:center}
.nut div{display:flex;flex-direction:column;gap:2px}
.nut .sub{font-size:10px}
.nut b{font-size:14px;font-variant-numeric:tabular-nums}
.nutin{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.upl{cursor:pointer;margin-bottom:12px}
.meal{display:flex;gap:12px;align-items:center}
.meal img{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none}
.mimg{display:block;width:100%;max-width:100%;max-height:240px;object-fit:cover;border-radius:12px;margin-bottom:12px}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.slot{display:flex;align-items:center;justify-content:center;aspect-ratio:3/4;max-width:100%;border:2px dashed var(--line);border-radius:12px;overflow:hidden;color:var(--sub);text-align:center;font-size:13px;cursor:pointer}
.slot img{width:100%;height:100%;object-fit:cover}
.gap{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.pri{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--sub)}
.pri.hi{background:var(--accent);color:var(--white)}
.note{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.6}
.lir{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.lir .li{border-bottom:0;flex:1;min-width:0}
.ibox{max-width:420px;max-height:92vh;overflow:auto}
.av{display:block;width:100%;height:210px;background:var(--card2);border-radius:12px;margin-top:10px}
.av .bd{fill:var(--skin);stroke:var(--card2);stroke-width:.7}
.av .bd.far{fill:var(--skin2)}
.av .mu{fill:var(--mus)}
.av .mu.far{fill:var(--mus2)}
.av .hot{fill:var(--hot)}
.av .m2{fill:var(--hot-soft)}
.av .hair{fill:var(--hair)}
.av .gr{stroke:var(--line);stroke-width:2}
.av .pr,.av .pr line{fill:var(--prop);stroke:var(--prop)}
.av .pf{stroke:var(--sub);stroke-linecap:round}
.av .ld{fill:var(--plate);stroke:var(--sub);stroke-width:1.5}
.av .ldc{fill:var(--sub)}
.av .cb{stroke:var(--sub);stroke-width:1.2;stroke-dasharray:3 3}
.mmap{display:flex;justify-content:center;gap:20px;margin-top:10px;text-align:center}
.mmap svg{display:block;height:170px;width:auto}
.mmap svg>*,.mmap g>*{fill:var(--mm)}
.mmap .hot{fill:var(--hot)}
.mmap .m2{fill:var(--hot-soft)}
.mleg{display:flex;flex-direction:column;gap:4px;margin-top:10px;font-size:13px}
.mleg .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--hot)}
.mleg .dot.m2{background:var(--hot-soft)}
.hot{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
<header><h1 id="title">LiftLog</h1></header>
<main><div class="empty">読み込み中…</div></main>
<div id="rest" hidden><div class="fill"></div><div class="rin"><span class="sub">休憩</span><b class="t"></b><button class="btn sm" data-a="restAdd" data-s="-15">-15</button><button class="btn sm" data-a="restAdd" data-s="15">+15</button><button class="btn sm p" data-a="restSkip">スキップ</button></div></div>
<nav>
<button data-a="tab" data-tab="workout"><span class="i">🏋️</span>記録</button>
<button data-a="tab" data-tab="calendar"><span class="i">📅</span>カレンダー</button>
<button data-a="tab" data-tab="routines"><span class="i">📋</span>ルーティン</button>
<button data-a="tab" data-tab="stats"><span class="i">👤</span>マイ</button>
</nav>
<div id="modal" hidden></div>
<div id="dlg" hidden></div>
<div id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s);
const KEY='liftlog-v1';
const PARTS=['胸','背中','脚','肩','腕','腹','有酸素'];
const DEFAULT_EX={
 胸:['ベンチプレス','インクラインベンチプレス','ダンベルプレス','インクラインダンベルプレス','ダンベルフライ','チェストプレス','ケーブルクロスオーバー','ディップス','腕立て伏せ'],
 背中:['デッドリフト','懸垂','ラットプルダウン','ベントオーバーロウ','シーテッドロウ','ワンハンドダンベルロウ','Tバーロウ','バックエクステンション'],
 脚:['スクワット','レッグプレス','ブルガリアンスクワット','ルーマニアンデッドリフト','ランジ','レッグエクステンション','レッグカール','カーフレイズ','ヒップスラスト'],
 肩:['ショルダープレス','ダンベルショルダープレス','サイドレイズ','フロントレイズ','リアレイズ','フェイスプル','アップライトロウ'],
 腕:['バーベルカール','ダンベルカール','ハンマーカール','プリーチャーカール','トライセプスプッシュダウン','フレンチプレス','ナローベンチプレス'],
 腹:['クランチ','レッグレイズ','プランク','アブローラー','ケーブルクランチ'],
 有酸素:['ランニング','ウォーキング','バイク','ローイング']
};
const MACHINE_ADD={
 胸:['ペックフライ（バタフライ）','インクラインチェストプレス','デクラインチェストプレス','アイソラテラル・チェストプレス','スミスマシン・ベンチプレス','スミスマシン・インクラインベンチプレス','ケーブルフライ（ロー→ハイ）','アシストディップス'],
 背中:['アシスト懸垂（チンニングマシン）','マシンロウ','アイソラテラル・ロウ','アイソラテラル・ラットプルダウン','プルオーバーマシン','ストレートアームプルダウン','ワンハンドケーブルロウ','スミスマシン・ベントオーバーロウ','ロワーバックマシン'],
 脚:['ハックスクワット','45度レッグプレス','ペンデュラムスクワット','Vスクワット','スミスマシン・スクワット','シーテッドレッグカール','ライイングレッグカール','アダクション（内もも）','アブダクション（外もも）','グルートマシン','ケーブルキックバック','シーテッドカーフレイズ','スタンディングカーフレイズマシン'],
 肩:['マシンショルダープレス','スミスマシン・ショルダープレス','ラテラルレイズマシン','ケーブルサイドレイズ','リアデルトマシン（リバースペックフライ）','ケーブルリアレイズ','ケーブルフロントレイズ','スミスマシン・シュラッグ'],
 腕:['アームカールマシン','ケーブルカール','ケーブルハンマーカール（ロープ）','トライセプスエクステンションマシン','ロープ・プッシュダウン','ケーブル・オーバーヘッドエクステンション','ケーブル・トライセプスキックバック'],
 腹:['アブドミナルクランチマシン','ロータリートルソー（腹斜筋）','ケーブルウッドチョップ','ハンギングレッグレイズ（パワータワー）'],
 有酸素:['クロストレーナー','ステアクライマー','リカンベントバイク','スキーエルゴ']
};
for(const p in MACHINE_ADD)DEFAULT_EX[p].push(...MACHINE_ADD[p]);
const EQS=['マシン','フリーウェイト','自重'];
const BODY=new Set(['ディップス','腕立て伏せ','懸垂','バックエクステンション','カーフレイズ','クランチ','レッグレイズ','プランク','アブローラー','ランニング','ウォーキング','ハンギングレッグレイズ（パワータワー）']);
const MACHINE=new Set(['チェストプレス','ケーブルクロスオーバー','ラットプルダウン','シーテッドロウ','レッグプレス','レッグエクステンション','レッグカール','フェイスプル','トライセプスプッシュダウン','ケーブルクランチ','バイク','ローイング',...Object.values(MACHINE_ADD).flat()]);
function eqOf(e){return e.eq||(BODY.has(e.name)?'自重':MACHINE.has(e.name)||/マシン|ケーブル|スミス/.test(e.name)?'マシン':'フリーウェイト')}
const TITLES={workout:'ワークアウト',calendar:'カレンダー',food:'食事',ai:'AI診断',routines:'ルーティン',stats:'マイページ'};
const GOALS={bb:'ボディビル（筋肥大・見た目）',ath:'身体機能向上（筋力・運動能力）',mix:'両方（バランス重視）'};

const NUT=[['protein','たんぱく質','g'],['fat','脂質','g'],['carbs','炭水化物','g'],['fiber','食物繊維','g'],['salt','塩分','g']];
const TEMPLATES={
 '全身A':['ベンチプレス','スクワット','ラットプルダウン','ダンベルショルダープレス','バーベルカール','トライセプスプッシュダウン'],
 '全身B':['インクラインダンベルプレス','ルーマニアンデッドリフト','ベントオーバーロウ','サイドレイズ','ハンマーカール','レッグレイズ'],
 'プッシュ':['ベンチプレス','インクラインダンベルプレス','ダンベルショルダープレス','サイドレイズ','トライセプスプッシュダウン','フレンチプレス'],

 '下半身':['スクワット','ルーマニアンデッドリフト','レッグプレス','レッグカール','カーフレイズ','アブローラー'],
 '胸':['ベンチプレス','インクラインダンベルプレス','ダンベルフライ','ケーブルクロスオーバー','ディップス'],
 '背中':['デッドリフト','懸垂','ベントオーバーロウ','ラットプルダウン','シーテッドロウ'],
 '肩':['ショルダープレス','サイドレイズ','リアレイズ','フェイスプル','アップライトロウ'],
 '腕':['バーベルカール','ナローベンチプレス','ハンマーカール','フレンチプレス','プリーチャーカール','トライセプスプッシュダウン'],
 '筋力A':['スクワット','ベンチプレス','懸垂','ワンハンドダンベルロウ','プランク'],
 '筋力B':['デッドリフト','ショルダープレス','ベントオーバーロウ','ブルガリアンスクワット','レッグレイズ'],
 'パワー＆体幹':['ランジ','ヒップスラスト','腕立て伏せ','フェイスプル','アブローラー','ローイング'],
 'コンディショニング':['バイク','ブルガリアンスクワット','腕立て伏せ','懸垂','プランク','ランニング'],
 '上半身（筋力＋筋肥大）':['ベンチプレス','懸垂','ダンベルショルダープレス','シーテッドロウ','サイドレイズ','バーベルカール','トライセプスプッシュダウン'],
 '下半身（筋力＋筋肥大）':['スクワット','ルーマニアンデッドリフト','ブルガリアンスクワット','レッグカール','カーフレイズ','プランク'],
 'パワー＆全身':['デッドリフト','ランジ','ヒップスラスト','ワンハンドダンベルロウ','アブローラー','バイク']
};
const SPLITS={

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pad(n){return String(n).padStart(2,'0')}
function dkey(t){const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function fmtDur(ms){const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}:${pad(m)}:${pad(s%60)}`:`${pad(m)}:${pad(s%60)}`}
function num(n){return Math.round(n).toLocaleString()}
function r1(n){return Math.round((+n||0)*10)/10}
function clone(o){return JSON.parse(JSON.stringify(o))}
const REST_OPTS=[30,45,60,90,120,150,180,240,300];
function fmtRest(v){return v<60?`${v}秒`:`${Math.floor(v/60)}分${v%60?`${v%60}秒`:''}`}
function getEx(id){return S.exercises.find(e=>e.id===id)||{name:'(削除済み)',part:'-'}}
function partOf(name){for(const p of PARTS)if(DEFAULT_EX[p].includes(name))return p;return '腹'}
function exIdByName(name){let e=S.exercises.find(x=>x.name===name);if(!e){e={id:uid(),name,part:partOf(name)};S.exercises.push(e)}return e.id}
function sessVol(h){return h.items.reduce((a,it)=>a+it.sets.reduce((b,s)=>b+(s.done===false?0:(+s.w||0)*(+s.r||0)),0),0)}
function e1rm(s){return +s.r<=1?+s.w:+s.w*(1+ +s.r/30)}
function weekStart(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
function ageOf(b){if(!b)return null;const [y,m,d]=b.split('-').map(Number),n=new Date();let a=n.getFullYear()-y;if(n.getMonth()+1<m||(n.getMonth()+1===m&&n.getDate()<d))a--;return a}

function defaults(){const s={exercises:[],routines:[],history:[],meals:[],current:null,rest:90,profile:{},diag:null};for(const p of PARTS)for(const n of DEFAULT_EX[p])s.exercises.push({id:uid(),name:n,part:p});return s}
function normalize(s){const have=new Set(s.exercises.map(e=>e.name));for(const p of PARTS)for(const n of DEFAULT_EX[p])if(!have.has(n))s.exercises.push({id:uid(),name:n,part:p});s.routines=s.routines||[];s.history=s.history||[];s.meals=s.meals||[];s.rest=s.rest||90;s.current=s.current||null;s.profile=s.profile||{};s.diag=s.diag||null;s.history.sort((a,b)=>a.start-b.start);return s}

async function load(){

   const id=db&&user&&await user.id();
   if(id){
    const ref=db.doc('data/users/'+id+'/state');
    const [st,hs]=await timeout(Promise.all([ref.get(),ref.collection('sessions').get()]),12000);
    S=normalize(st.exists?{...clone(st.data()),history:hs.docs.map(x=>clone(x.data()))}:{...defaults(),history:hs.docs.map(x=>clone(x.data()))});
    uref=ref;
    return;
   }
  }catch(e){toast('クラウドに接続できないため、この端末内に保存します')}
 }

async function loadMeals(day){

}

 else{S.meals.push(m);save()}
}

async function replaceAll(next){

  try{

   for(const h of next.history)await sessCol().doc(h.id).set(clone(h));
   for(const m of next.meals)await mealCol().doc(m.id).set(clone(m));

function genPlan(goal,days){
 const p=S.profile,split=SPLITS[goal][days],notes=[REST[goal]];
 const beginner=S.history.length<8,old=ageOf(p.birth)>=50,fatHi=!!p.bf&&(p.sex==='female'?+p.bf>=32:+p.bf>=25);
 if(beginner)notes.push('最初の1か月は重量よりフォームを優先し、余力を2〜3回残して終える');
 if(old)notes.push('ウォームアップを長めにとり、関節に痛みが出る種目は避ける');
 if(fatHi)notes.push('体脂肪を落とすため、各日の最後に有酸素20分を追加');
 if(goal==='ath'&&days>=4)notes.push('コンディショニングの日は休憩を短くして続けて回す（サーキット）');
 const dayList=split.map(name=>{
  const items=TEMPLATES[name].map((n,idx)=>{
   const part=partOf(n);
   if(part==='有酸素')return{name:n,sets:1,rep:'20分'};
   if(part==='腹')return{name:n,sets:3,rep:n==='プランク'?'30〜60秒':'15回'};
   let [sets,rep]=RX[goal][MAIN.has(n)||(goal==='mix'&&idx===0)?'main':'acc'];
   if(beginner)sets=Math.min(sets,3);
   if(old)sets=Math.max(2,sets-1);
   return{name:n,sets,rep};
  });
  if(fatHi&&!items.some(i=>i.rep==='20分'))items.push({name:goal==='bb'?'ウォーキング':'バイク',sets:1,rep:'20分'});
  return{name,items};
 });
 const sched=Array.from({length:days},(_,i)=>split[i%split.length]).join(' → ');
 return{days:dayList,schedule:`週${days}日: ${sched}`,notes};
}

function barChart(vals,labels){
 const W=320,H=120,max=Math.max(...vals,1),bw=W/vals.length;
 return `<svg viewBox="0 0 ${W} ${H+16}" class="chart">${vals.map((v,i)=>{const h=v/max*H;return `<rect x="${i*bw+6}" y="${H-h}" width="${bw-12}" height="${h}" rx="4" class="bar" opacity="${i===vals.length-1?1:.5}"/><text x="${i*bw+bw/2}" y="${H+13}" text-anchor="middle">${labels[i]}</text>`}).join('')}</svg>`;
}
function lineChart(pts){
 if(pts.length<2)return '<div class="sub mt">2回以上記録するとグラフが表示されます</div>';
 const W=320,H=120,P=10,ys=pts.map(p=>p.y),mn=Math.min(...ys),mx=Math.max(...ys),r=mx-mn||1;
 const xy=pts.map((p,i)=>[P+i*(W-2*P)/(pts.length-1),P+(H-2*P)*(1-(p.y-mn)/r)]);
 return `<svg viewBox="0 0 ${W} ${H+16}" class="chart"><polyline points="${xy.map(a=>a.join(',')).join(' ')}" class="ln"/>${xy.map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="3.5" class="dot"/>`).join('')}<text x="${P}" y="${H+13}">${pts[0].x}</text><text x="${W-P}" y="${H+13}" text-anchor="end">${pts[pts.length-1].x}</text><text x="${P}" y="${P+2}">${mx.toFixed(1)}kg</text><text x="${P}" y="${H-2}">${mn.toFixed(1)}kg</text></svg>`;
}

function vStats(){
 const ws=weekStart(new Date()),vals=[],labels=[];
 for(let i=7;i>=0;i--){const s=new Date(ws);s.setDate(s.getDate()-7*i);const e=new Date(s);e.setDate(e.getDate()+7);vals.push(S.history.filter(h=>h.start>=s&&h.start<e).reduce((a,h)=>a+sessVol(h),0));labels.push(`${s.getMonth()+1}/${s.getDate()}`)}
 const wk=S.history.filter(h=>h.start>=ws),n=new Date(),mon=S.history.filter(h=>{const d=new Date(h.start);return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()});
 const since=Date.now()-30*864e5,pc={};
 S.history.filter(h=>h.start>=since).forEach(h=>h.items.forEach(it=>{const p=getEx(it.exId).part;pc[p]=(pc[p]||0)+it.sets.length}));
 const pmax=Math.max(1,...Object.values(pc));
 const done=[...new Set(S.history.flatMap(h=>h.items.map(i=>i.exId)))].filter(id=>S.exercises.some(e=>e.id===id));
 if(!done.includes(statEx))statEx=done[0]||'';
 let prog='<div class="sub mt">まだ記録がありません</div>';
 if(statEx){
  const rows=S.history.filter(h=>h.items.some(i=>i.exId===statEx)).map(h=>{const sets=h.items.find(i=>i.exId===statEx).sets,d=new Date(h.start);return{x:`${d.getMonth()+1}/${d.getDate()}`,y:Math.max(...sets.map(e1rm)),w:Math.max(...sets.map(s=>+s.w))}});
  prog=`<div class="tiles mt"><div><b>${Math.max(...rows.map(r=>r.w))}</b><span class="sub">最大重量kg</span></div><div><b>${Math.max(...rows.map(r=>r.y)).toFixed(1)}</b><span class="sub">推定1RM kg</span></div><div><b>${rows.length}</b><span class="sub">実施回数</span></div></div><div class="sub mt">推定1RMの推移</div>${lineChart(rows.slice(-20))}`;
 }
 return vProfile()+`<div class="sec">トレーニング統計</div>
 <div class="card tiles"><div><b>${wk.length}</b><span class="sub">今週の回数</span></div><div><b>${mon.length}</b><span class="sub">今月の回数</span></div><div><b>${S.history.length}</b><span class="sub">累計</span></div></div>
 <div class="card"><b>週間ボリューム</b><div class="sub">今週 ${num(vals[7])}kg</div>${barChart(vals,labels)}</div>
 <div class="card"><b>部位別セット数</b><span class="sub">（直近30日）</span>${PARTS.map(p=>`<div class="pbar"><span>${p}</span><div><i style="width:${(pc[p]||0)/pmax*100}%"></i></div><span class="sub">${pc[p]||0}</span></div>`).join('')}</div>
 <div class="card"><b>種目別の成長</b>${done.length?`<select class="inp full mt" id="statEx">${done.map(id=>`<option value="${id}" ${id===statEx?'selected':''}>${esc(getEx(id).name)}</option>`).join('')}</select>`:''}${prog}</div>
 <div class="sec">設定</div>
 <div class="card"><div class="row between"><span>休憩タイマー（標準）</span><select class="inp" id="restSel">${REST_OPTS.map(v=>`<option value="${v}" ${v===S.rest?'selected':''}>${fmtRest(v)}</option>`).join('')}</select></div><div class="sub mt">種目ごとの休憩時間は、ワークアウト中に各種目の ⏱ ボタンから変更できます。</div></div>
 <div class="card"><div class="sub">${uref?'記録はアカウントに保存され、どの端末からでも見られます':'記録はこの端末のブラウザに保存されています'}</div><div class="row mt"><button class="btn grow" data-a="exp">バックアップ書き出し</button><button class="btn grow" data-a="imp">読み込み</button></div><input type="file" id="imp" accept=".json,application/json" hidden><button class="btn d full mt" data-a="reset">全データ削除</button></div>`;
}

 if(f){
  for(const [q,k,a,t,fl] of [['q','k','a','t',1],['q2','k2','a2','t2',-1]]){seg('th',q,k,0,fl);seg('sh',k,a,0,fl);dot(t,'bd',3.5)}

function toJpeg(file,max,q,asUrl){
 return new Promise((res,rej)=>{
  const u=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{
   URL.revokeObjectURL(u);
   const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
   c.width=Math.max(1,Math.round(img.naturalWidth*s));c.height=Math.max(1,Math.round(img.naturalHeight*s));
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);
   if(asUrl)res(c.toDataURL('image/jpeg',q));else c.toBlob(b=>b?res(b):rej(),'image/jpeg',q);
  };
  img.onerror=()=>{URL.revokeObjectURL(u);rej()};
  img.src=u;
 });
}

}
async function startMeal(f){
 let big,thumb;
 try{big=await toJpeg(f,1280,.85);thumb=await toJpeg(f,240,.6,true)}catch(_){return toast('画像を読み込めませんでした')}
 const h=new Date().getHours();
 const d={thumb,status:'loading',type:h<10?'朝食':h<15?'昼食':h<18?'間食':'夕食'};
 mealDraft=d;mealCtl=new AbortController();
 renderMealModal();
 try{
  const r=await sampleFn.json(MEAL_PROMPT,{images:[big],signal:mealCtl.signal});
  if(mealDraft!==d)return;
  if(!r||typeof r!=='object'||r.error){d.status='error';d.err=(r&&r.error)||'食事が写っていないようです'}
  else{
   d.status='done';
   d.r={name:String(r.name||'食事'),items:(Array.isArray(r.items)?r.items:[]).slice(0,20).map(i=>({name:String(i&&i.name||''),amount:String(i&&i.amount||''),kcal:+(i&&i.kcal)||0})),comment:String(r.comment||'')};
   for(const k of ['kcal','protein','fat','carbs','fiber','salt'])d.r[k]=Math.max(0,+r[k]||0);
  }
 }catch(e){if(mealDraft!==d||e.code==='cancelled')return;d.status='error';d.err=aiErr(e)}
 renderMealModal();
}
async function runDiag(){

 try{
  const r=await sampleFn.json(diagPrompt(),{images:[diagImgs.ideal.blob,diagImgs.now.blob],signal:diagCtl.signal});
  if(!r||typeof r!=='object'||!r.summary)throw{code:'invalid_json'};
  S.diag={at:Date.now(),r};save();diagState=null;
 }catch(e){diagState=e.code==='cancelled'?null:{status:'error',err:aiErr(e)}}
 diagCtl=null;
 if(tab==='ai')render();
}

function beep(){
 try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
 if(!actx)return;
 try{[0,.25].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=880;g.gain.value=.25;o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.18)})}catch(e){}
}
function tick(){
 if(!S)return;
 const el=$('#elapsed');if(el&&S.current&&S.current.start)el.textContent=fmtDur(Date.now()-S.current.start);
 const bar=$('#rest');
 if(!rest){bar.hidden=true;return}
 const left=Math.ceil((rest.end-Date.now())/1000);
 if(left<=0){rest=null;bar.hidden=true;beep();return}
 bar.hidden=false;
 bar.querySelector('.t').textContent=`${Math.floor(left/60)}:${pad(left%60)}`;
 bar.querySelector('.fill').style.width=Math.min(100,left/rest.total*100)+'%';
}

 setupDone:()=>{const p=readProfile();if(!p)return;S.profile=p;save();render();scrollTo(0,0);toast('セットアップが完了しました')},
 rNew:()=>openRedit(),
 rEdit:d=>openRedit(S.routines.find(r=>r.id===d.id)),
 rDel:async d=>{if(await ask('このルーティンを削除しますか？',{ok:'削除',danger:true})){S.routines=S.routines.filter(r=>r.id!==d.id);save();render()}},
 rSet:d=>{const it=redit.items[+d.i];it.sets=Math.max(1,it.sets+ +d.v);renderRedit()},
 rRm:d=>{redit.items.splice(+d.i,1);renderRedit()},
 rAdd:()=>openPicker(ids=>{ids.forEach(id=>redit.items.push({exId:id,sets:3}));renderRedit()},renderRedit),
 rSave:()=>{
  if(!redit.name.trim())return toast('ルーティン名を入力してください');
  if(!redit.items.length)return toast('種目を追加してください');
  if(redit.id)S.routines=S.routines.map(r=>r.id===redit.id?redit:r);else S.routines.push({...redit,id:uid()});
  save();closeModal();render();
 },
 exp:()=>exportData(),
 imp:()=>$('#imp').click(),
 reset:async()=>{if(await ask('全データを削除します。元に戻せません。よろしいですか？',{ok:'すべて削除',danger:true}))await replaceAll(normalize(defaults()))}
};

document.addEventListener('click',e=>{
 if(!S)return;
 if(!actx)try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(_){}
 if(e.target.id==='modal')return ACT.close();
 const b=e.target.closest('[data-a]');
 if(b&&ACT[b.dataset.a])ACT[b.dataset.a](b.dataset,b);
});
document.addEventListener('input',e=>{
 const t=e.target,d=t.dataset;
 if(d.f&&S.current){S.current.items[+d.i].sets[+d.j][d.f]=t.value===''?'':+t.value;save();const v=$('#tvol');if(v)v.textContent=num(sessVol(S.current))}
 else if(t.id==='pq'){pick.q=t.value;renderPick()}
 else if(t.id==='rname')redit.name=t.value;
 else if(t.id==='pf-btext'){const v=t.value.replace(/\D/g,'').slice(0,8);t.value=v.slice(0,4)+(v.length>4?'/'+v.slice(4,6):'')+(v.length>6?'/'+v.slice(6):'');setBirth(v.length===8?`${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6)}`:'',true)}
 else if(['pf-by','pf-bm','pf-bd'].includes(t.id)){const [y,m,d]=['by','bm','bd'].map(k=>$('#pf-'+k).value);setBirth(y&&m&&d?`${y}-${pad(m)}-${pad(d)}`:'',false)}
});
document.addEventListener('change',async e=>{
 const t=e.target;
 if(t.id==='restSel'){S.rest=+t.value;save()}
 else if(t.id==='statEx'){statEx=t.value;render()}
 else if(t.id==='pl-goal'){plan.goal=t.value;renderPlan()}
 else if(t.id==='pl-days'){plan.days=+t.value;renderPlan()}
 else if(t.id==='mealFile'&&t.files[0]){const f=t.files[0];t.value='';startMeal(f)}
 else if((t.id==='diag-ideal'||t.id==='diag-now')&&t.files[0]){
  const f=t.files[0],k=t.id.slice(5);t.value='';
  try{diagImgs[k]={blob:await toJpeg(f,1280,.85),thumb:await toJpeg(f,400,.7,true)}}catch(_){return toast('画像を読み込めませんでした')}
  render();
 }
 else if(t.id==='imp'&&t.files[0]){
  const f=t.files[0];t.value='';
  let d;
  try{d=JSON.parse(await f.text());if(!Array.isArray(d.exercises)||!Array.isArray(d.history))throw 0}catch(_){return toast('このファイルは読み込めません')}
  if(await ask('現在のデータを読み込んだデータで上書きしますか？',{ok:'上書き',danger:true})){await replaceAll(normalize(d));toast('読み込みました')}
 }
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&uref&&saveT)flush()});

load().then(()=>{render();setInterval(tick,500);initAI()});
</script>

</body></html>
